"""
=== Agent Lab Kubernetes Deployment ===
"""

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-lab-api
  labels:
    app: agent-lab-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-lab-api
  template:
    metadata:
      labels:
        app: agent-lab-api
    spec:
      containers:
        - name: agent-lab-api
          image: agent-lab-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: postgres-service
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: agent_lab
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5