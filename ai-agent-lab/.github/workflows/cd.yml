
name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Build package
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build
    
    - name: Deploy to staging
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          cd /opt/apps/ai-agent-lab
          git pull origin main
          pip install -r requirements.txt
          systemctl restart ai-agent-lab
    
    - name: Run health check
      run: |
        curl -s https://staging.example.com/health | grep -q "healthy"
    
    - name: Deploy to production
      if: success()
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd /opt/apps/ai-agent-lab
          git pull origin main
          pip install -r requirements.txt
          systemctl restart ai-agent-lab
    
    - name: Verify production deployment
      run: |
        curl -s https://api.example.com/health | grep -q "healthy"
    
    - name: Send notification
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "Deployment successful! Version ${{ github.ref_name }} deployed to production."
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
